jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: setup repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
    timeout-minutes: 10
  test:
    runs-on: ubuntu-latest
    name: Test (Node.js ${{ matrix.node_js_version }})
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: setup repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '${{ matrix.node_js_version }}'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node_js_version:
          - '22.16.0'
          - '24'
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: setup repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
    timeout-minutes: 10
name: Lint, test and build
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
